members:
  - name: Aimable Nizigiyimana
    role: Founder & Chief Executive Officer
    bio: >
      Mr. Aimable NIZIGIYIMANA

      Founder & CEO

      Aimable NIZIGIYIMANA doesn't just lead Holistic Impact Hub — he built it, from the ground up, out of a conviction that lasting change has to be community-owned. A peacebuilding practitioner, social entrepreneur, and youth advocate, he founded HIH in 2020 and has since guided it to registration as a UN Partner Portal National NGO CSO Partner (Ordonnance Ministérielle N°530/1548) — drafting and signing the organization's PSEA and Environmental & Social Safeguards policies, and representing HIH before regional bodies including the AU PANCOGEd 2 conference on gender equality.


      His work reaches where it's needed most: leading peace dialogue and reconciliation sessions for Congolese refugees and Burundian returnees that have resolved 50+ land and ethnic disputes; coordinating sanitation and hygiene initiatives that have brought clean water access to over 3,000 people; and mobilizing 500+ youth annually through leadership and entrepreneurship training that has now trained 600+ young leaders in total. Before founding HIH, he spent two years as a volunteer Project Coordinator supporting Burundian returnees to reintegrate into their communities and mediating the land and ethnic disputes that too often keep families displaced.


      That record has earned recognition well beyond Burundi's borders — the United People Global Sustainability Leadership Award, the United People Global BIASHARA Entrepreneurship Award, selection as a competitive candidate for the Rotary Peace Fellowship, and representation of East African youth at the 4th East African Youth Parliament in Arusha, Tanzania. He is also a Golden-level Global Citizen member, a Global Youth Ambassador for Young Creative Leaders in Burundi, and a World Youth Ambassador representing the European Youth Association in Burundi. He holds a Civil Engineering diploma from Hope Africa University and speaks Kirundi, French, English, and Swahili — the languages of the communities he serves.


      Never one to stop building, Aimable recently launched HiHub, a verified digital platform connecting NGOs, donors, and communities across the Great Lakes region — extending HIH's core commitment to transparency and accountability into a tool the entire regional NGO ecosystem can use to build trust.

      Aimable leads with the belief that Burundi's future will be written by its own people — and that HIH's role is to walk alongside them as they write it.
    photo: /assets/images/aimable-headshot-square-newbg.jpg
  - name: "Armelle Jade "
    role: Secretary & Communications Officer
    bio: >
      Ms. Armelle Jade Icitegetse

      Secretary & Communications Officer

      Few people bring the range that Armelle Jade Icitegetse brings to Holistic Impact Hub. A journalist by training and an award-winning writer by craft — recipient of a Literature Prize from the French Embassy in Burundi — she has spent her career at the intersection of storytelling, project coordination, and public engagement: as a reporter for Intege Magazine, a blogger for Yaga Burundi, a monitoring & evaluation agent for Magazine Jimbere, an assistant to project management at the French Institute, and Executive Director at Mshalt.


      That's exactly the toolkit Holistic Impact Hub's mission demands. As Secretary & Communications Charge, Armelle is the connective tissue holding the organization's internal operations and external voice together — documenting every commitment with the rigor of a trained journalist, and communicating every story of impact with the clarity and credibility that donors, partners, and communities can trust. Her experience running her own projects as a freelance chef de projet and artist manager means she doesn't just relay information — she understands how organizations actually move, and she keeps HIH moving in step with its mission.

      In a sector where accountability is everything, Armelle Jade Icitegetse makes sure Holistic Impact Hub's story is told — and told right.
    photo: /assets/images/armelle-jade-headshot-square.jpg
  - name: "Marie Goreth HARERIMANA "
    role: partnerships & Resources Mobilization Lead
    bio: >-
      Mrs. Marie Goreth HARERIMANA

      Partnerships & Resources Mobilization Lead

      Marie Goreth HARERIMANA is the architect of Holistic Impact Hub's growth beyond its own walls. She builds the strategic partnerships and mobilizes the resources that turn ambitious programs into funded, running realities — cultivating relationships with donors, institutions, and stakeholders who believe, as she does, in community-driven change.


      With 18+ local and international partners already engaged and a track record of expanding HIH's reach, Marie Goreth doesn't just secure support — she builds coalitions of people and organizations committed to the same vision: resilient, self-reliant communities across Burundi and the Great Lakes region.

      Every new partnership she forges is another bridge between resource and need, between intention and impact.
    photo: /assets/images/mariegoreth-headshot-square.jpg
