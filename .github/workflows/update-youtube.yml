name: Update YouTube videos

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch videos from YouTube feed
        run: |
          python3 - <<'PY'
          import re, json, html, urllib.request, urllib.error

          HANDLE = "holisticimpacthub"
          headers = {"User-Agent": "Mozilla/5.0", "Cookie": "CONSENT=YES+1"}

          channel_req = urllib.request.Request("https://www.youtube.com/@" + HANDLE, headers=headers)
          channel_html = urllib.request.urlopen(channel_req, timeout=30).read().decode("utf-8", "ignore")
          match = re.search(r'"channelId":"(UC[\w-]{22})"', channel_html) or re.search(r'"externalId":"(UC[\w-]{22})"', channel_html) or re.search(r'channel/(UC[\w-]{22})', channel_html)
          CHANNEL = match.group(1)

          url = "https://www.youtube.com/feeds/videos.xml?channel_id=" + CHANNEL
          req = urllib.request.Request(url, headers=headers)
          feed = urllib.request.urlopen(req, timeout=30).read().decode("utf-8")
          entries = re.findall(r"<entry>(.*?)</entry>", feed, re.S)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          opener = urllib.request.build_opener(NoRedirect)

          def is_short(vid):
              try:
                  req = urllib.request.Request("https://www.youtube.com/shorts/" + vid, method="HEAD", headers=headers)
                  return opener.open(req, timeout=20).status == 200
              except Exception:
                  return False

          items = []
          for e in entries[:12]:
              vid = re.search(r"<yt:videoId>(.*?)</yt:videoId>", e).group(1)
              title = html.unescape(re.search(r"<title>(.*?)</title>", e, re.S).group(1).strip())
              items.append((vid, title, is_short(vid)))

          if items:
              with open("_data/youtube.yml", "w", encoding="utf-8") as f:
                  for vid, title, short in items:
                      f.write("- id: %s\n  title: %s\n" % (vid, json.dumps(title, ensure_ascii=False)))
                      if short:
                          f.write("  vertical: true\n")
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add _data/youtube.yml
          git diff --cached --quiet || (git commit -m "Update YouTube videos" && git push)
