about:
  eyebrow: "Our holistic approach"
  title: "Advancing Burundi's sustainable development"
  image: "https://primary.jwwb.nl/public/g/y/v/temp-zjdhbpfsatqhfrkshkqh/img_0543-high.jpg"
  image_alt: "Holistic Impact Hub community work"
  paragraph_1: "Holistic Impact Hub is a Burundi-based non-profit dedicated to fostering resilient, thriving, and self-reliant communities. We integrate health, education, environment, and economic growth to create lasting, positive change."
  paragraph_2: "We pride ourselves on our integrated and community-driven approach. By addressing multiple facets of well-being — from health to education, environmental resilience to economic empowerment — we ensure comprehensive and sustainable development in Burundi, contributing directly to the UN Sustainable Development Goals."
  points:
    - "Community-driven programs designed with, not for, the people they serve"
    - "Ten integrated program pillars spanning health, education, environment and livelihoods"
    - "18+ local and international partners working alongside us"
  sdgs:
    - number: "1"
      label: "No Poverty"
    - number: "3"
      label: "Good Health"
    - number: "4"
      label: "Quality Education"
    - number: "5"
      label: "Gender Equality"
    - number: "6"
      label: "Clean Water"
    - number: "8"
      label: "Decent Work"
    - number: "13"
      label: "Climate Action"
    - number: "17"
      label: "Partnerships"

approach:
  eyebrow: "How change happens"
  title: "Our theory of change"
  intro: "We don't parachute in with solutions — we build them together with the communities we serve, addressing root causes rather than symptoms."
  steps:
    - number: "01"
      title: "Listen & assess"
      text: "We work directly with community leaders and members to understand real needs, existing strengths, and local priorities before designing any program."
    - number: "02"
      title: "Co-design & deliver"
      text: "Programs are built with community input across our ten pillars — health, education, environment, and economic empowerment — and delivered by local teams."
    - number: "03"
      title: "Sustain & scale"
      text: "We build local capacity and partnerships so progress continues and grows well beyond our direct involvement, creating lasting self-reliance."

programs_section:
  eyebrow: "Core program areas"
  title: "Practical solutions, rooted in local challenges"
  intro: "Holistic Impact Hub offers a range of specialized programs tailored to meet the unique needs of communities across Burundi."
  footnote: "Ten integrated pillars, one holistic mission."

