name: Update YouTube videos

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch videos from YouTube feed
        run: |
          python3 - <<'PY'
          import re, json, html, urllib.request

          CHANNEL = "UCVmNpAfDPwCN3CeTu0KNcww"
          feed_url = "https://www.youtube.com/feeds/videos.xml?channel_id=" + CHANNEL
          proxy_url = "https://api.rss2json.com/v1/api.json?rss_url=" + urllib.request.quote(feed_url, safe="")

          req = urllib.request.Request(proxy_url, headers={"User-Agent": "Mozilla/5.0"})
          data = json.loads(urllib.request.urlopen(req, timeout=30).read().decode("utf-8"))

          headers = {"User-Agent": "Mozilla/5.0", "Cookie": "CONSENT=YES+1"}

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          opener = urllib.request.build_opener(NoRedirect)

          def is_short(vid):
              try:
                  req = urllib.request.Request("https://www.youtube.com/shorts/" + vid, method="HEAD", headers=headers)
                  return opener.open(req, timeout=20).status == 200
              except Exception:
                  return False

          items = []
          for entry in data.get("items", [])[:12]:
              vid_match = re.search(r"[?&]v=([\w-]{11})", entry.get("link", ""))
              if not vid_match:
                  continue
              vid = vid_match.group(1)
              title = html.unescape(entry.get("title", "").strip())
              items.append((vid, title, is_short(vid)))

          if items:
              with open("_data/youtube.yml", "w", encoding="utf-8") as f:
                  for vid, title, short in items:
                      f.write("- id: %s\n  title: %s\n" % (vid, json.dumps(title, ensure_ascii=False)))
                      if short:
                          f.write("  vertical: true\n")
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add _data/youtube.yml
          git diff --cached --quiet || (git commit -m "Update YouTube videos" && git push)
